name: C++23 Autotools Consolidated CI/CD
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pipeline:
    name: Core CI/CD Engine
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CCACHE_MAXSIZE: 500M
      CCACHE_NODIRECT: 1
      WINEPREFIX: /home/runner/.wine

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Bootstrap Project Architecture via Autoscaffold
      run: |
        if [ ! -f configure.ac ]; then
          git clone https://github.com/jamal-fuma/autoscaffold.git /home/runner/autoscaffold
          cd /home/runner/autoscaffold
          git config --global user.name "${{ github.event.head_commit.author.name || 'github-actions[bot]' }}"
          git config --global user.email "${{ github.event.head_commit.author.email || 'github-actions[bot]@://github.com' }}"
          ./configure.sh "${{ github.workspace }}/"
        fi


    - name: Evaluate Metadata & Flags
      id: meta
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        PR_TITLE="${{ github.event.pull_request.title }}"
        if [[ "$COMMIT_MSG" == *":full-rebuild"* ]] || [[ "$PR_TITLE" == *":full-rebuild"* ]]; then
          echo "force_clean=true" >> $GITHUB_OUTPUT
        else
          echo "force_clean=false" >> $GITHUB_OUTPUT
        fi

        CURRENT_DAY=$(date -u +%u)
        SECONDS_TO_SUBTRACT=$(( (CURRENT_DAY - 1) * 86400 ))
        CURRENT_TIMESTAMP=$(date -u +%s)
        MIDNIGHT_TIMESTAMP=$(( CURRENT_TIMESTAMP - (CURRENT_TIMESTAMP % 86400) ))
        WEEK_START_EPOCH=$(( MIDNIGHT_TIMESTAMP - SECONDS_TO_SUBTRACT ))
        echo "week_epoch=${WEEK_START_EPOCH}" >> $GITHUB_OUTPUT
        if [ "${{ steps.meta.outputs.force_clean }}" = "true" ]; then
          echo "key_modifier=${{ steps.meta.outputs.week_epoch }}-clean-${{ github.sha }}" >> $GITHUB_OUTPUT
        else
          echo "key_modifier=${{ steps.meta.outputs.week_epoch }}" >> $GITHUB_OUTPUT
        fi

    - name: Calculate Release Suffix
      id: version
      run: |
        git fetch --tags --force
        MATCHING_TAGS=$(git tag -l "v${{ steps.meta.outputs.week_epoch }}-rc*")
        if [ -z "$MATCHING_TAGS" ]; then
          RC_NUMBER=1
        else
          LAST_RC=$(echo "$MATCHING_TAGS" | sed "s/^v${{ steps.meta.outputs.week_epoch }}-rc//" | sort -n | tail -n 1)
          RC_NUMBER=$(( LAST_RC + 1 ))
        fi
        echo "release_version=v${{ steps.meta.outputs.week_epoch }}-rc${RC_NUMBER}" >> $GITHUB_OUTPUT

    - name: Cache Air-Gapped Debian Packages
      id: cache-deb
      uses: actions/cache@v5
      with:
        path: .apt_cache_store
        key: deb-pkgs-${{ steps.meta.outputs.key_modifier }}
        restore-keys: deb-pkgs-

    - name: Install Monolithic System Tooling (Air-Gapped Local Mirror)
      run: |
        sudo mkdir -p .apt_cache_store
        # 1. Staging local repo framework requirements
        sudo apt-get update && sudo apt-get install -y dpkg-dev

        # 2. Extract or Download package binary layout
        if [ "${{ steps.cache-deb.outputs.cache-hit }}" != "true" ] || [ "${{ steps.meta.outputs.force_clean }}" = "true" ]; then
          echo "Cache miss or full-build triggered. Downloading fresh packages..."
          cd .apt_cache_store
          apt-get download autoconf automake autopoint bash bison bzip2 ccache dpkg-dev flex g++-14 gettext gperf intltool libgdk-pixbuf2.0-bin libgdk-pixbuf2.0-dev libtool libtool-bin libxml-parser-perl lzip make p7zip-full python3-mako ruby sed unzip wget wine64 xz-utils
          dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
          cd ..
        fi

        # 3. Mount fully offline sandbox and override Apt Sources Engine
        ABS_CACHE_DIR="${{ github.workspace }}/.apt_cache_store"
        echo "deb [trusted=yes] file:${ABS_CACHE_DIR} ./" | sudo tee /etc/apt/sources.list.d/local-airgap.list
        sudo sed -i 's/^deb /# deb /' /etc/apt/sources.list # Comment out public mirrors to guarantee air-gap

        # 4. Instant sub-second installation loop from the local archive
        sudo apt-get update
        sudo apt-get install -y --allow-unauthenticated \
          autoconf automake libtool make ccache dpkg-dev g++-14 p7zip-full wine64
          autopoint \
          bash \
          bison \
          bzip2 \
          flex \
          gettext \
          gperf \
          intltool \
          libgdk-pixbuf2.0-bin \
          libgdk-pixbuf2.0-dev \
          libtool-bin \
          libxml-parser-perl \
          lzip \
          python3-mako \
          ruby \
          sed \
          unzip \
          wget \
          xz-utils

    - name: Cache MXE Toolchain
      id: cache-mxe
      uses: actions/cache@v5
      with:
        path: mxe-toolchain
        key: mxe-gcc14-x86_64-w64-mingw32-${{ steps.meta.outputs.key_modifier }}
        restore-keys: mxe-gcc14-x86_64-w64-mingw32-

    - name: Bootstrap MXE Toolchain
      if: steps.cache-mxe.outputs.cache-hit != 'true' || steps.meta.outputs.force_clean == 'true'
      run: |
        if [ "${{ steps.cache-mxe.outputs.cache-hit }}" != "true" ] || [ "${{ steps.meta.outputs.force_clean }}" = "true" ]; then\
          rm -rf mxe-toolchain
          git clone https://github.com/mxe/mxe.git mxe-toolchain
          cd mxe-toolchain
          sudo ln -s "${{ github.workspace }}/mxe-toolchain" /opt/mxe'
          sudo chown -R $USER:$USER /opt/mxe "${{ github.workspace }}/mxe-toolchain"
          make JOBS=$(nproc) MXE_TARGETS='x86_64-w64-mingw32.static' gcc
          cd ..
        fi

    - name: Cache Linux Environment (Autotools & ccache)
      uses: actions/cache@v5
      with:
        path: |
          **/config.cache-linux
          .ccache_linux
        key: build-cache-linux-${{ steps.meta.outputs.key_modifier }}-${{ hashFiles('**/configure.ac', '**/Makefile.am') }}
        restore-keys: build-cache-linux-${{ steps.meta.outputs.key_modifier }}-

    - name: Cache Windows Environment (Autotools & ccache)
      uses: actions/cache@v5
      with:
        path: |
          **/config.cache-windows
          .ccache_windows
        key: build-cache-windows-${{ steps.meta.outputs.key_modifier }}-${{ hashFiles('**/configure.ac', '**/Makefile.am') }}
        restore-keys: build-cache-windows-${{ steps.meta.outputs.key_modifier }}-

    - name: Handle Forced Cache Purge
      if: steps.meta.outputs.force_clean == 'true'
      run: |
        rm -f config.cache-linux config.cache-windows config.status
        rm -rf .ccache_linux .ccache_windows

    - name: Bootstrap Autotools
      run: autoreconf -i

    - name: Build & Validate Native Linux
      id: build-linux
      run: |
        export SOURCE_DATE_EPOCH="${{ steps.meta.outputs.week_epoch }}"
        export CCACHE_DIR="${{ github.workspace }}/.ccache_linux"
        export CC="ccache gcc-14"
        export CXX="ccache g++-14"
        export CXXFLAGS="-std=c++23 -O3"
        export CCACHE_BASEDIR="${{ github.workspace }}"
        CONF_CACHE="${{ github.workspace }}/config.cache-linux"

        if [ "${{ steps.meta.outputs.force_clean }}" = "true" ]; then
          ./configure --prefix=/usr
        else
          ./configure --prefix=/usr --cache-file=$CONF_CACHE
        fi

        PROJ_NAME=$(awk -F= '/^PACKAGE_TARNAME =/{print $2}' Makefile | tr -d '[:space:]')
        if [ -z "$PROJ_NAME" ]; then PROJ_NAME=$(awk -F= '/^PACKAGE =/{print $2}' Makefile | tr -d '[:space:]'); fi
        echo "project_name=${PROJ_NAME}" >> $GITHUB_OUTPUT

        make -j$(nproc)
        make check
        make distcheck DISTCHECK_CONFIGURE_FLAGS="CC='$CC' CXX='$CXX' CXXFLAGS='$CXXFLAGS' --cache-file=$CONF_CACHE --prefix=/usr"

        DEB_VER=$(echo "${{ steps.version.outputs.release_version }}" | sed 's/^v//')
        PKG_DIR="${{ github.workspace }}/debian-package"
        mkdir -p "${PKG_DIR}/DEBIAN"
        make install DESTDIR="${PKG_DIR}"
        cat << EOF > "${PKG_DIR}/DEBIAN/control"
        Package: ${PROJ_NAME}
        Version: ${DEB_VER}
        Section: utils
        Priority: optional
        Architecture: amd64
        Depends: libc6 (>= 2.38)
        Maintainer: Runner <runner@github.com>
        Description: Compiled C++23 Autotools package for ${PROJ_NAME}.
        EOF
        dpkg-deb --build --root-owner-group "${PKG_DIR}" "${PROJ_NAME}_${DEB_VER}_amd64.deb"
        make distclean

    - name: Build & Validate Windows MXE
      run: |
        export SOURCE_DATE_EPOCH="${{ steps.meta.outputs.week_epoch }}"
        export PATH="/opt/mxe/usr/bin:$PATH"
        export CCACHE_DIR="${{ github.workspace }}/.ccache_windows"
        export CC="ccache x86_64-w64-mingw32.static-gcc"
        export CXX="ccache x86_64-w64-mingw32.static-g++"
        export CXXFLAGS="-std=c++23 -O3"
        export CCACHE_BASEDIR="${{ github.workspace }}"
        CONF_CACHE="${{ github.workspace }}/config.cache-windows"
        PROJ_NAME="${{ steps.build-linux.outputs.project_name }}"

        # Configure targeting Windows via MXE, aligning installation prefix inside the debian layout space
        if [ "${{ steps.meta.outputs.force_clean }}" = "true" ]; then
          ./configure --host=x86_64-w64-mingw32.static --prefix="/usr/share/mxe/${PROJ_NAME}"
        else
          ./configure --host=x86_64-w64-mingw32.static --prefix="/usr/share/mxe/${PROJ_NAME}" --cache-file=$CONF_CACHE
        fi

        make -j$(nproc)
        wine64 tests/test_suite.exe
        make distcheck DISTCHECK_CONFIGURE_FLAGS="--host=x86_64-w64-mingw32.static CC='$CC' CXX='$CXX' CXXFLAGS='$CXXFLAGS' LOG_COMPILER='wine64' --cache-file=$CONF_CACHE --prefix=/usr/share/mxe/${PROJ_NAME}"

        # Package Windows output identically into an architecture-all MXE Debian Package
        DEB_VER=$(echo "${{ steps.version.outputs.release_version }}" | sed 's/^v//')
        PKG_DIR_WIN="${{ github.workspace }}/debian-package-mxe"
        mkdir -p "${PKG_DIR_WIN}/DEBIAN"
        make install DESTDIR="${PKG_DIR_WIN}"
        cat << EOF > "${PKG_DIR_WIN}/DEBIAN/control"
        Package: ${PROJ_NAME}-mxe
        Version: ${DEB_VER}
        Section: utils
        Priority: optional
        Architecture: all
        Depends: wine64
        Maintainer: Runner <runner@github.com>
        Description: Cross-compiled Windows binaries for ${PROJ_NAME} wrapped in a Debian runtime layer.
        EOF
        dpkg-deb --build --root-owner-group "${PKG_DIR_WIN}" "${PROJ_NAME}-mxe_${DEB_VER}_all.deb"

    - name: Stage Artifact Payload
      run: |
        mkdir -p payload
        cp -f *.tar.gz *.tar.xz *.deb payload/ || true

    - name: Upload Workspace Artifacts
      uses: actions/upload-artifact@v5
      with:
        name: final-release-packages
        path: payload/
        retention-days: 2

    - name: Push Git Release Tag
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      run: |
        git config --global user.name "${{ github.event.head_commit.author.name || 'github-actions[bot]' }}"
        git config --global user.email "${{ github.event.head_commit.author.email || 'github-actions[bot]@://github.com' }}"
        git tag -a "${{ steps.version.outputs.release_version }}" -m "Weekly Release"
        git push origin "${{ steps.version.outputs.release_version }}"

    - name: Publish GitHub Draft Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.release_version }}
        name: "${{ steps.build-linux.outputs.project_name }} Release ${{ steps.version.outputs.release_version }}"
        draft: true
        prerelease: true
        files: payload/*
